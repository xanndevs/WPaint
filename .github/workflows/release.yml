name: WPaint Release

on:
  push:
    tags:
      - 'v*'
  # Lets a dry run be exercised from the Actions tab before the first real tag.
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          target: desktop
          modules: ''
          cache: true

      - name: Configure CMake
        run: >
          cmake -S .
          -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      # The deploy script added to CMakeLists.txt runs here, so this tree has
      # bin/ plus the Qt libraries and plugins rather than a bare binary.
      - name: Install
        run: cmake --install build

      - name: Verify the deploy tree
        run: |
          test -x install/bin/wpaint || { echo "no binary in install/bin"; exit 1; }
          # A bundle with no Qt of its own is the failure mode worth catching
          # here: it builds fine and then only runs where Qt is installed.
          if [ -z "$(find install/lib -name 'libQt6Core.so*' 2>/dev/null)" ]; then
            echo "Qt runtime was NOT bundled into install/lib -- the AppImage"
            echo "would depend on the host's Qt. Aborting."
            exit 1
          fi
          echo "Bundled Qt libraries:"
          ls install/lib/libQt6*.so* | head -20

      # Proves the bundle is self-contained before it is published, using the
      # same offscreen smoke test as CI.
      - name: Smoke test the bundled binary
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./install/bin/wpaint --screenshot /tmp/bundled.png

      # Assemble the AppDir and convert it with appimagetool, the tool the
      # AppImage project publishes. The wrapper action this replaced
      # (Kidev/qt-appimage) is three bugs deep: it interpolates inputs into
      # `docker run` unquoted, so any value containing a space arrives split
      # and every later field shifts by one; it resolves the install folder
      # inside its container, where the workspace is mounted at /workspace, so
      # "./install" becomes the nonexistent "/install"; and it reports its
      # output through $GITHUB_OUTPUT, which is never passed into the
      # container, so the output is empty and the upload step has no file to
      # upload. One maintainer, no issues, last touched in 2025.
      - name: Create AppDir
        run: |
          # The AppDir layout appimagetool requires, which is stricter than the
          # install tree: the desktop entry and the icon must sit at the root as
          # well as under usr/share, because appimagetool looks for them there
          # and aborts otherwise, and the icon has to be named exactly what the
          # desktop file's Icon= key says.
          mkdir -p AppDir/usr/bin AppDir/lib \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/scalable/apps
          cp install/bin/wpaint AppDir/usr/bin/wpaint
          cp -r install/lib/. AppDir/lib/
          # The Qt deploy script writes plugins to <prefix>/plugins, which is
          # NOT inside lib/ -- so without this the AppImage carries no image
          # format plugins, no icon engine and no platform plugin, and still
          # starts under the offscreen platform where none of that is needed.
          cp -r install/plugins AppDir/plugins
          cp packaging/wpaint.desktop AppDir/
          cp packaging/wpaint.desktop AppDir/usr/share/applications/
          cp assets/wpaint.svg AppDir/
          cp assets/wpaint.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          chmod +x AppDir/usr/bin/wpaint

          # The AppImage starts fine without its plugins under the offscreen
          # platform, so their absence has to be asserted rather than waited
          # for: a JPEG or a PNG open failing on someone else's machine is
          # exactly the bug this catches.
          test -d AppDir/plugins/imageformats \
            || { echo "no image format plugins in the AppDir"; exit 1; }
          echo "Plugins bundled: $(find AppDir/plugins -name '*.so' | wc -l)"

          # An AppImage without an AppRun is a file that cannot be executed:
          # the format's entry point has to be named exactly this.
          cat > AppDir/AppRun <<'RUNNER'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/wpaint" "$@"
          RUNNER
          chmod +x AppDir/AppRun

          # The deploy script writes a qt.conf whose Prefix is relative to the
          # install layout ("..", i.e. one above bin/). That is wrong inside an
          # AppDir and makes the binary abort on startup because it looks for
          # its plugins in a directory that does not exist -- so write one for
          # the AppDir instead, where the root is the prefix.
          cat > AppDir/qt.conf <<'CONF'
          [Paths]
          Prefix = .
          Plugins = plugins
          QmlImports = qml
          CONF

      # appimagetool turns the AppDir into an AppImage. linuxdeploy is the
      # usual companion, but its job is finding and bundling an app's
      # dependencies -- and the deploy script above has already done exactly
      # that, from a real Qt install rather than by pattern-matching the host.
      # All that is left is the conversion, which is what this tool does.
      - name: Fetch appimagetool
        run: |
          curl -sSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - name: Build the AppImage
        run: |
          mkdir -p out
          # CI has no FUSE, so the tool has to fall back to its self-extracting
          # mode; without this the runtime mount fails and the step dies.
          # Positional: SOURCE AppDir, then DESTINATION. There is no --appdir
          # flag; that one belongs to linuxdeploy.
          ./appimagetool.AppImage AppDir out/WPaint.AppImage --no-appstream

      # An AppImage can be produced and still be unable to run -- a wrong
      # qt.conf, a missing AppRun, a plugin directory the binary cannot find --
      # and none of that shows up until something executes it. Unpack it and
      # run the entry point exactly as the runtime would.
      - name: Verify the AppImage runs
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x out/WPaint.AppImage
          ./out/WPaint.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun || { echo "no executable AppRun"; exit 1; }
          ( cd squashfs-root && QT_QPA_PLATFORM=offscreen ./AppRun --screenshot /tmp/from-appimage.png )
          test -s /tmp/from-appimage.png || { echo "AppImage produced no frame"; exit 1; }
          echo "AppImage runs and renders: $(stat -c%s /tmp/from-appimage.png) bytes"

      - name: Upload AppImage as a workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: WPaint-AppImage
          path: out/*.AppImage

      # A manual run has no tag, and publishing against the branch ref would
      # create a release named after a branch. Manual runs stop at the artifact.
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: true