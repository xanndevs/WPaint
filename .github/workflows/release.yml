name: WPaint Release

on:
  push:
    tags:
      - 'v*'
  # Lets a dry run be exercised from the Actions tab before the first real tag.
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          target: desktop
          modules: ''
          cache: true

      - name: Configure CMake
        run: >
          cmake -S .
          -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      # The deploy script added to CMakeLists.txt runs here, so this tree has
      # bin/ plus the Qt libraries and plugins rather than a bare binary.
      - name: Install
        run: cmake --install build

      - name: Verify the deploy tree
        run: |
          test -x install/bin/wpaint || { echo "no binary in install/bin"; exit 1; }
          # A bundle with no Qt of its own is the failure mode worth catching
          # here: it builds fine and then only runs where Qt is installed.
          if [ -z "$(find install/lib -name 'libQt6Core.so*' 2>/dev/null)" ]; then
            echo "Qt runtime was NOT bundled into install/lib -- the AppImage"
            echo "would depend on the host's Qt. Aborting."
            exit 1
          fi
          echo "Bundled Qt libraries:"
          ls install/lib/libQt6*.so* | head -20

      # Proves the bundle is self-contained before it is published, using the
      # same offscreen smoke test as CI.
      - name: Smoke test the bundled binary
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./install/bin/wpaint --screenshot /tmp/bundled.png

      # linuxdeploy + appimagetool rather than a wrapper action. The wrapper
      # (Kidev/qt-appimage) is three bugs deep: it interpolates inputs into
      # `docker run` unquoted, so any value with a space arrives split and
      # every later field shifts; it resolves the install folder inside the
      # container, where the workspace is /workspace, so "./install" becomes
      # the nonexistent "/install"; and it writes its output to $GITHUB_OUTPUT,
      # which is never passed into the container, so the output is empty and
      # the upload step silently has no file. These two tools are the ones it
      # wraps, and both are maintained.
      - name: Create AppDir
        run: |
          # Standard AppDir layout: usr/bin is where linuxdeploy is pointed, and
          # the top-level bin/ + lib/ is what the AppImage runtime resolves
          # against qt.conf. Desktop entry and icon go to usr/share so the
          # AppImage registers them with the host.
          mkdir -p AppDir/usr/bin AppDir/bin AppDir/lib \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/scalable/apps
          cp install/bin/wpaint AppDir/usr/bin/wpaint
          cp -r install/lib/. AppDir/lib/ 2>/dev/null || true
          cp install/bin/qt.conf AppDir/usr/bin/qt.conf 2>/dev/null || true
          cp packaging/wpaint.desktop AppDir/usr/share/applications/
          cp assets/wpaint.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          chmod +x AppDir/usr/bin/wpaint

      - name: Run linuxdeploy
        run: |
          docker run --rm -v "$PWD:/project" \
            linuxdeploy/linuxdeploy \
            /project/AppDir/usr/bin/wpaint \
            --appdir \
            --plugin qt \
            --output appimage \
            --destination /project/out

      - name: Upload AppImage as a workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: WPaint-AppImage
          path: out/*.AppImage

      # A manual run has no tag, and publishing against the branch ref would
      # create a release named after a branch. Manual runs stop at the artifact.
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: true